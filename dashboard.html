<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sri Vishnu Priya Finance - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME STYLES --- */
        :root {
            --primary-bg: #f0f2f5; 
            --brand-color: #0c2046; 
            --brand-gradient: linear-gradient(135deg, #0B3B60 0%, #1a5276 100%);
            --accent-color: #E2A03F; 
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #4b5563;
            --success: #27ae60;
            --border-color: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', Arial, sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-main); -webkit-tap-highlight-color: transparent; padding-bottom: 20px; }

        /* --- HEADER --- */
        .top-nav { background: var(--brand-gradient); padding: 25px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: white; position: relative; }
        .header-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-content h1 { font-size: 18px; font-weight: 800; color: var(--accent-color); margin: 0; }
        .header-subtitle { font-size: 12px; font-weight: 600; opacity: 0.9; margin-top: 2px; }
        
        .btn-logout { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-logout:active { background: rgba(255,255,255,0.3); }

        /* --- LIVE STATS SECTION --- */
        .stats-container { display: flex; gap: 10px; margin-top: 10px; }
        .stat-box { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 12px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 16px; font-weight: 800; margin-bottom: 3px; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; font-weight: 600; }

        /* --- MAIN DASHBOARD GRID --- */
        .dashboard-container { padding: 20px; }
        .section-title { font-size: 13px; font-weight: 800; color: var(--brand-color); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .nav-card { background: var(--card-bg); border-radius: 15px; padding: 20px 10px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .nav-card:active { transform: scale(0.95); background: #f8fafc; }
        
        .nav-card i { font-size: 24px; color: var(--brand-color); margin-bottom: 5px; }
        .nav-card span { font-size: 12px; font-weight: 700; color: var(--text-main); }
        
        /* Highlight specific icons */
        .ic-visit { color: var(--success) !important; }
        .ic-reminder { color: #f59e0b !important; }
        .ic-attendance { color: #3b82f6 !important; }

        /* Status Dot */
        .status-dot { display: inline-block; width: 8px; height: 8px; background-color: #4ade80; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 5px #4ade80; }
    </style>
</head>
<body>

    <!-- HEADER SECTION -->
    <div class="top-nav">
        <div class="header-top-row">
            <div class="header-content">
                <h1>SRI VISHNU PRIYA</h1>
                <div class="header-subtitle"><span class="status-dot"></span><span id="userNameDisplay">Loading...</span></div>
            </div>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        
        <!-- STATS -->
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-value" id="todayCol">₹0</div>
                <div class="stat-label">Today Collection</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="monthCol">₹0</div>
                <div class="stat-label">Month Collection</div>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="section-title">Main Menu</div>
        
        <div class="nav-grid">
            
            <!-- 1. COMPLETED: Digital ID Card -->
            <div class="nav-card" onclick="window.location.href='digital-id.html'">
                <i class="fas fa-id-badge"></i>
                <span>Digital ID Card</span>
            </div>

            <!-- 2. COMPLETED: Customer Visit Form -->
            <div class="nav-card" onclick="window.location.href='customer-visit.html'">
                <i class="fas fa-users ic-visit"></i>
                <span>Customer Visit</span>
            </div>

            <!-- 3. COMPLETED: Visit Status (My Visits) -->
            <div class="nav-card" onclick="window.location.href='my-visits.html'">
                <i class="fas fa-clipboard-check"></i>
                <span>Visit Status</span>
            </div>

            <!-- 4. COMPLETED: My Reminders -->
            <div class="nav-card" onclick="window.location.href='my-reminders.html'">
                <i class="fas fa-bell ic-reminder"></i>
                <span>My Reminders</span>
            </div>

            <!-- 5. PENDING: Target Summary -->
            <div class="nav-card" onclick="alert('Target Summary page is under construction. Ippudu idhe start cheddam!')">
                <i class="fas fa-chart-line"></i>
                <span>Target Summary</span>
            </div>

            <!-- 6. PENDING: My History -->
            <div class="nav-card" onclick="alert('My History page is under construction.')">
                <i class="fas fa-history"></i>
                <span>My History</span>
            </div>

            <!-- 7. PENDING: My Complaints -->
            <div class="nav-card" onclick="alert('My Complaints page is under construction.')">
                <i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i>
                <span>My Complaints</span>
            </div>

            <!-- 8. PENDING: My Attendance -->
            <div class="nav-card" onclick="alert('My Attendance page is under construction.')">
                <i class="fas fa-fingerprint ic-attendance"></i>
                <span>My Attendance</span>
            </div>

        </div>
    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        window.currentEmpId = null;

        const date = new Date();
        const currentYearMonth = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}`;
        const todayStr = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentEmpId = user.email.split('@')[0];
                
                try {
                    const empSnap = await get(child(ref(db), `employees/${window.currentEmpId}`));
                    if(empSnap.exists()) {
                        document.getElementById('userNameDisplay').innerText = `Agent: ${empSnap.val().name}`;
                    } else {
                        document.getElementById('userNameDisplay').innerText = `Agent: ${window.currentEmpId}`;
                    }
                    
                    fetchLiveStats();
                } catch(e) { console.log(e); }
                
            } else {
                window.location.href = "index.html"; 
            }
        });

        async function fetchLiveStats() {
            try {
                const visitsSnap = await get(child(ref(db), `visits/${currentYearMonth}`));
                let todayTotal = 0;
                let monthTotal = 0;

                if (visitsSnap.exists()) {
                    const visitsData = visitsSnap.val();
                    for (const vId in visitsData) {
                        const v = visitsData[vId];
                        
                        // Check if it belongs to logged in agent
                        if (v.eid === window.currentEmpId && v.stat === 'PAID') {
                            let amt = parseInt(v.amt) || 0;
                            
                            // Add to Month Total
                            monthTotal += amt;

                            // Add to Today Total
                            if (v.date === todayStr) {
                                todayTotal += amt;
                            }
                        }
                    }
                }
                
                document.getElementById('todayCol').innerText = `₹${todayTotal.toLocaleString('en-IN')}`;
                document.getElementById('monthCol').innerText = `₹${monthTotal.toLocaleString('en-IN')}`;

            } catch(e) { console.log("Stats Error", e); }
        }

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                alert("Logout Error!");
            });
        }
    </script>
</body>
</html>
