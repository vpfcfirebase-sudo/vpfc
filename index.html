<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sri Vishnu Priya Finance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME STYLES --- */
        :root {
            --primary-bg: #f0f2f5; 
            --brand-color: #0B3B60; 
            --brand-gradient: linear-gradient(135deg, #0B3B60 0%, #1a5276 100%);
            --accent-color: #E2A03F; 
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --success: #27ae60;
            --danger: #e74c3c;
            --border-color: #e0e0e0;
            --input-bg: #fafafa;
        }

        [data-theme="light"] {
            --primary-bg: #f8f9fa; --brand-color: #2563eb; --brand-gradient: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%); --accent-color: #ffffff; --card-bg: #ffffff; --text-main: #1f2937; --text-muted: #6b7280; --border-color: #e5e7eb; --input-bg: #f3f4f6;
        }

        [data-theme="dark"] {
            --primary-bg: #121212; --brand-color: #1e1e1e; --brand-gradient: linear-gradient(135deg, #1f2937 0%, #111827 100%); --accent-color: #3b82f6; --card-bg: #1f2937; --text-main: #f3f4f6; --text-muted: #9ca3af; --border-color: #374151; --input-bg: #374151;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--primary-bg); color: var(--text-main); -webkit-tap-highlight-color: transparent; }

        /* --- LOGIN SCREEN --- */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: var(--brand-gradient); padding: 20px; }
        .login-card { background: var(--card-bg); padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 380px; text-align: center; }
        .login-logo { width: 70px; height: 70px; background-color: var(--brand-color); color: var(--accent-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; margin: 0 auto 20px auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .login-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .login-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }
        .input-wrapper { position: relative; margin-bottom: 20px; }
        .input-wrapper i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-wrapper input { width: 100%; padding: 15px 15px 15px 45px; border: 1.5px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; background-color: var(--input-bg); color: var(--text-main); }
        .btn-login { width: 100%; padding: 15px; background-color: var(--brand-color); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }

        /* --- MAIN APP --- */
        #main-app { display: none; padding-bottom: 30px; }
        .top-nav { background: var(--brand-gradient); padding: 20px 20px 35px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-top-row { display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 15px; }
        .header-actions i { font-size: 20px; margin-left: 15px; cursor: pointer; color: white; opacity: 0.9; }
        .header-content h1 { font-size: 18px; font-weight: 700; color: var(--accent-color); margin: 0; }
        
        .status-badge { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px; }
        #status-text { font-size: 13px; font-weight: 600; color: #ffbaba; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--danger); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        .filter-card { background: var(--card-bg); margin: -25px 20px 20px 20px; padding: 15px 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10; }
        .filter-card select { padding: 8px 15px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text-main); outline: none; background-color: var(--input-bg); }

        .grid-dashboard { padding: 0 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .grid-item { background: var(--card-bg); border-radius: 16px; padding: 20px 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid var(--border-color); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; background: var(--input-bg); color: var(--brand-color); display: flex; justify-content: center; align-items: center; font-size: 22px; margin-bottom: 12px; }
        .grid-item h3 { font-size: 13px; font-weight: 600; color: var(--text-main); }

        /* --- CAMERA MODAL --- */
        #camera-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .camera-container { background: var(--card-bg); padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; }
        .camera-container h3 { color: var(--brand-color); margin-bottom: 15px; }
        #video-feed { width: 100%; border-radius: 15px; background: #000; object-fit: cover; }
        .camera-btns { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .cam-btn { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; color: white; flex: 1; }
        .btn-cancel { background: var(--danger); }
        .btn-capture { background: var(--success); }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo"><i class="fas fa-chart-line"></i></div>
            <h2>SRI VISHNU PRIYA</h2>
            <p>Finance Management System</p>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" id="email" placeholder="Login ID (e.g. 002)" required>
            </div>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button class="btn-login" id="loginBtn" onclick="handleLogin()">Secure Login</button>
            <p id="error-message" style="color: var(--danger); font-size: 13px; margin-top: 15px; display: none; font-weight: 600;"></p>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="main-app">
        <div class="top-nav">
            <div class="header-top-row">
                <div class="header-content">
                    <h1>SRI VISHNU PRIYA</h1>
                    <!-- USER NAME DISPLAY CHESE CHOTA -->
                    <div style="font-size: 13px; opacity: 0.9; margin-top:3px; font-weight: 600;" id="user-display-email">Welcome!</div>
                </div>
                <div class="header-actions">
                    <i class="fas fa-palette" onclick="toggleTheme()" title="Change Theme"></i>
                    <i class="fas fa-sign-out-alt" onclick="handleLogout()" title="Logout"></i>
                </div>
            </div>
            
            <div class="status-badge">
                <span id="status-text">Offline</span>
                <label class="switch">
                    <input type="checkbox" id="statusSwitch" onchange="handleToggleChange()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="filter-card">
            <span style="color: var(--text-main);"><i class="far fa-calendar-alt" style="margin-right: 5px;"></i> Active Month</span>
            <select id="monthSelect">
                <option value="0">January</option><option value="1">February</option><option value="2">March</option>
                <option value="3">April</option><option value="4">May</option><option value="5">June</option>
                <option value="6">July</option><option value="7">August</option><option value="8">September</option>
                <option value="9">October</option><option value="10">November</option><option value="11">December</option>
            </select>
        </div>

        <div class="grid-dashboard">
            <div class="grid-item"><div class="icon-box"><i class="fas fa-chart-pie"></i></div><h3>Dashboard</h3></div>
            <div class="grid-item"><div class="icon-box"><i class="fas fa-id-badge"></i></div><h3>Digital ID Card</h3></div>
            <div class="grid-item"><div class="icon-box"><i class="fas fa-users"></i></div><h3>Customer Visit</h3></div>
            <div class="grid-item"><div class="icon-box"><i class="fas fa-clipboard-check"></i></div><h3>Visit Status</h3></div>
            <div class="grid-item"><div class="icon-box"><i class="fas fa-bell"></i></div><h3>My Reminders</h3></div>
            <div class="grid-item"><div class="icon-box"><i class="fas fa-bullseye"></i></div><h3>Target Summary</h3></div>
            <div class="grid-item"><div class="icon-box"><i class="fas fa-history"></i></div><h3>My History</h3></div>
            <div class="grid-item"><div class="icon-box"><i class="fas fa-exclamation-triangle"></i></div><h3>My Complaints</h3></div>
            <div class="grid-item" style="grid-column: span 2;"><div class="icon-box" style="color: #27ae60;"><i class="fas fa-user-clock"></i></div><h3>My Attendance</h3></div>
        </div>
    </div>

    <!-- CAMERA MODAL (Selfie) -->
    <div id="camera-modal">
        <div class="camera-container">
            <h3>Attendance Selfie</h3>
            <p style="font-size: 13px; margin-bottom:10px; color:var(--text-muted);">Please take a photo to go online</p>
            <video id="video-feed" autoplay playsinline></video>
            <canvas id="photo-canvas" style="display: none;"></canvas>
            <div class="camera-btns">
                <button class="cam-btn btn-cancel" onclick="closeCamera()">Cancel</button>
                <button class="cam-btn btn-capture" id="captureBtn" onclick="takeSelfie()">Capture & Go Online</button>
            </div>
            <p id="cam-status" style="font-size: 12px; color: var(--brand-color); margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        // get mariyu child imports add chesanu database nunchi name fetch cheyyadaniki
        import { getDatabase, ref, set, update, onDisconnect, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getStorage, ref as storageRef, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app",
            messagingSenderId: "184676228358",
            appId: "1:184676228358:web:c2b32b68debeeadadfd287",
            measurementId: "G-E3TT96ZH1T"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const storage = getStorage(app);
        
        window.auth = auth;
        window.db = db;
        window.storage = storage;
        window.firebaseDbRef = ref;
        window.firebaseDbSet = set;
        window.firebaseDbUpdate = update;
        window.firebaseDbGet = get; // Added for fetching data
        window.firebaseDbChild = child; // Added for fetching data
        window.firebaseOnDisconnect = onDisconnect;
        window.firebaseStorageRef = storageRef;
        window.firebaseUploadString = uploadString;
        window.firebaseGetDownloadURL = getDownloadURL;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.firebaseSignOut = signOut;

        window.currentUser = null;
        window.currentUserName = ""; // Global variable to store fetched name

        // --- AUTH STATE CHANGE WITH DATABASE FETCH ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                
                // Email nunchi id teeyadam (ex: 002@vpfc.com -> 002)
                const empId = user.email.split('@')[0];
                window.currentUserName = empId; // Default ga ID set chesthunnam
                
                try {
                    // Firebase DB lo 'employees/002' ni vethukuthunnam
                    const dbRef = window.firebaseDbRef(window.db);
                    const snapshot = await window.firebaseDbGet(window.firebaseDbChild(dbRef, `employees/${empId}`));
                    
                    if (snapshot.exists()) {
                        const employeeData = snapshot.val();
                        if (employeeData.name) {
                            window.currentUserName = employeeData.name; // Peru vasthe update chesthunnam (e.g. SIVA)
                        }
                    } else {
                        console.log("No employee data available for ID: " + empId);
                    }
                } catch (error) {
                    console.error("Error fetching employee name from database:", error);
                }
                
                // Header lo peru chupinchadam
                document.getElementById('user-display-email').innerText = `Welcome, ${window.currentUserName}`;
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('password').value = '';
                
                const userStatusRef = window.firebaseDbRef(window.db, 'live_locations/' + user.uid);
                window.firebaseOnDisconnect(userStatusRef).update({ status: 'offline' });
                
            } else {
                window.currentUser = null;
                window.currentUserName = "";
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
                stopTracking(); 
            }
        });
    </script>

    <!-- Custom JavaScript for UI Logic & Tracking -->
    <script>
        // --- THEME LOGIC ---
        const themes = ['default', 'light', 'dark'];
        let currentThemeIndex = 0;
        function applyTheme(themeName) {
            if(themeName === 'default') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('appTheme', themeName);
        }
        function toggleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(themes[currentThemeIndex]);
        }
        window.onload = function() {
            document.getElementById('monthSelect').value = new Date().getMonth();
            const savedTheme = localStorage.getItem('appTheme') || 'default';
            currentThemeIndex = themes.indexOf(savedTheme);
            applyTheme(savedTheme);
        };

        // --- LOGIN & LOGOUT ---
        function handleLogin() {
            let email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            const loginBtn = document.getElementById('loginBtn');
            if(!email || !password) { errorMsg.innerText = "Please enter Login ID and Password"; errorMsg.style.display = "block"; return; }
            if (!email.includes('@')) email = email + "@vpfc.com"; 

            loginBtn.innerText = "Authenticating...";
            window.signInWithEmailAndPassword(window.auth, email, password)
                .then(() => { loginBtn.innerText = "Secure Login"; errorMsg.style.display = "none"; })
                .catch((error) => {
                    loginBtn.innerText = "Secure Login";
                    errorMsg.innerText = "Incorrect Login ID or Password!";
                    errorMsg.style.display = "block";
                });
        }
        function handleLogout() {
            if(confirm("Are you sure you want to logout?")) {
                goOfflineMode(); 
                window.firebaseSignOut(window.auth);
            }
        }

        // --- CAMERA & ONLINE SWITCH LOGIC ---
        let mediaStream = null;

        function handleToggleChange() {
            const switchBtn = document.getElementById('statusSwitch');
            
            if (switchBtn.checked) {
                switchBtn.checked = false; 
                openCameraModal();
            } else {
                goOfflineMode();
            }
        }

        function openCameraModal() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('video-feed');
            
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Mee browser lo Camera support ledu. Prastutaniki photo lekundane online ki veltunnaru.");
                forceOnlineWithoutCamera();
                return;
            }

            modal.style.display = 'flex';
            document.getElementById('cam-status').innerText = "";

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then((stream) => {
                    mediaStream = stream;
                    video.srcObject = stream;
                })
                .catch((err) => {
                    alert("Camera open cheyyadaniki permission kaavali leda Camera ledu.");
                    closeCamera();
                });
        }

        function closeCamera() {
            if(mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            document.getElementById('camera-modal').style.display = 'none';
        }

        async function takeSelfie() {
            if(!window.currentUser) return;
            
            const video = document.getElementById('video-feed');
            const canvas = document.getElementById('photo-canvas');
            const statusTxt = document.getElementById('cam-status');
            const captureBtn = document.getElementById('captureBtn');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.6);
            
            statusTxt.innerText = "Uploading Selfie...";
            captureBtn.disabled = true;

            try {
                const fileName = `attendance_selfies/${window.currentUser.uid}_${Date.now()}.jpg`;
                const imgRef = window.firebaseStorageRef(window.storage, fileName);
                await window.firebaseUploadString(imgRef, imageData, 'data_url');
                const downloadURL = await window.firebaseGetDownloadURL(imgRef);

                closeCamera();
                captureBtn.disabled = false;
                
                setUIOnline();
                startLiveTracking(downloadURL);

            } catch(e) {
                console.error("Error:", e);
                statusTxt.innerText = "Error uploading. Try again.";
                captureBtn.disabled = false;
            }
        }
        
        function forceOnlineWithoutCamera() {
            setUIOnline();
            startLiveTracking("no-camera-supported");
        }

        function setUIOnline() {
            document.getElementById('statusSwitch').checked = true;
            const statusBadge = document.getElementById('status-text');
            statusBadge.innerText = "Online";
            statusBadge.style.color = "#a8e6cf"; 
        }

        // --- LIVE GPS TRACKING ---
        let watchId = null; 
        let lastPosition = null; 
        let totalDistance = 0; 

        function startLiveTracking(selfieUrl) {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const currentLat = position.coords.latitude;
                        const currentLon = position.coords.longitude;
                        
                        if (lastPosition) {
                            const dist = calculateDistance(lastPosition.lat, lastPosition.lon, currentLat, currentLon);
                            totalDistance += dist;
                        }
                        lastPosition = { lat: currentLat, lon: currentLon };

                        // DB ki pampinche data lo Realtime DB nunchi vachina peru (window.currentUserName) velthundi
                        if(window.currentUser) {
                            const locationRef = window.firebaseDbRef(window.db, 'live_locations/' + window.currentUser.uid);
                            window.firebaseDbSet(locationRef, {
                                name: window.currentUserName, 
                                email: window.currentUser.email,
                                status: "online",
                                lat: currentLat,
                                lon: currentLon,
                                totalDistanceKm: totalDistance.toFixed(2),
                                selfieUrl: selfieUrl,
                                lastUpdated: Date.now()
                            });
                        }
                    },
                    (error) => {
                        alert("GPS Location track cheyyadaniki permission kaavali.");
                        goOfflineMode();
                    },
                    { enableHighAccuracy: true, maximumAge: 5000, timeout: 5000 }
                );
            }
        }

        function goOfflineMode() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            lastPosition = null;
            totalDistance = 0;

            document.getElementById('statusSwitch').checked = false;
            document.getElementById('status-text').innerText = "Offline";
            document.getElementById('status-text').style.color = "#ffbaba";

            if(window.currentUser) {
                const locationRef = window.firebaseDbRef(window.db, 'live_locations/' + window.currentUser.uid);
                window.firebaseDbUpdate(locationRef, {
                    status: "offline",
                    lastUpdated: Date.now()
                });
            }
        }

        function stopTracking() {
            goOfflineMode();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI/180);  
            const dLon = (lon2 - lon1) * (Math.PI/180); 
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180)) * Math.cos(lat2*(Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c; 
        }
    </script>
</body>
</html>
