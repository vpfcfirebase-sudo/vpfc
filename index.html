<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAMBOLA BOOK</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f0f2f5; text-align: center; }
  .header { background: #1a237e; color: white; padding: 15px; font-size: 24px; font-weight: bold; border-bottom: 3px solid #ffeb3b; }
  .game-number { font-size: 16px; color: #ffeb3b; margin-top: 5px; }
  
  .container { padding: 20px; }
  .btn { padding: 10px 20px; font-size: 16px; color: white; background: #4caf50; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; transition: 0.3s; }
  .btn:hover { opacity: 0.9; }
  .btn.red { background: #f44336; } .btn.blue { background: #2196f3; }
  .input-box { padding: 10px; font-size: 16px; width: 150px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
  
  .panel { background: white; padding: 15px; margin: 15px auto; max-width: 600px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .big-number { font-size: 70px; color: #d32f2f; font-weight: bold; margin: 10px; }
  .link-box { background: #e3f2fd; padding: 15px; border: 1px dashed #2196f3; word-break: break-all; margin-top: 10px; font-size: 14px; }
  
  /* Tickets */
  .ticket-wrap { border: 3px solid #6a1b9a; margin: 15px auto; background: white; max-width: 500px; position: relative; }
  .t-head { background: #f3e5f5; color: #4a148c; padding: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  .cancel-btn { background: #f44336; color: white; border: none; padding: 5px 10px; cursor: pointer; font-size: 12px; border-radius: 3px; font-weight: bold;}
  .t-grid { display: grid; grid-template-columns: repeat(9, 1fr); border-top: 2px solid #6a1b9a; }
  .t-cell { border: 1px solid #ccc; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
  .t-cell.empty { background: #fafafa; border-color: transparent; }
  .t-cell.marked { background: #f44336; color: white; }
  
  /* Board */
  .board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; max-width: 500px; margin: 15px auto; }
  .b-cell { background: white; border: 1px solid #999; padding: 5px; font-size: 12px; font-weight: bold; }
  .b-cell.called { background: #ffeb3b; } .b-cell.current { background: #f44336; color: white; }
  
  #host-view, #player-view, #setup-view { display: none; }
</style>
</head>
<body>

<div class="header">
  THAMBOLA BOOK
  <div id="display-game-id" class="game-number"></div>
</div>

<div id="setup-view" class="container">
  <div class="panel">
    <h2>Welcome to Live Tambola</h2>
    <p>Database Connected Successfully.</p>
    <button class="btn blue" onclick="initHostGame()">START NEW GAME (HOST)</button>
  </div>
</div>

<div id="host-view" class="container">
  <div class="panel">
    <h2>Host Dashboard</h2>
    <div id="host-current-num" class="big-number">--</div>
    <button id="auto-play-btn" class="btn" onclick="toggleAutoPlay()">▶ START AUTO PLAY</button>
    <button class="btn blue" onclick="drawSingle()">Draw 1 Number</button>
  </div>

  <div class="panel">
    <h3>Create Player Tickets</h3>
    <input type="text" id="p-name" class="input-box" placeholder="Player Name">
    <input type="number" id="p-count" class="input-box" placeholder="Tickets (e.g. 2)" style="width: 100px;">
    <button class="btn" onclick="createPlayerLink()">Generate Link</button>
    <div id="link-output"></div>
  </div>

  <div class="panel">
    <h3>All Players Tickets (Live Track)</h3>
    <div id="host-tickets-area"></div>
  </div>
</div>

<div id="player-view" class="container">
  <div class="panel">
    <h2 id="player-welcome-name"></h2>
    <div class="board" id="player-board"></div>
    <div id="player-current-num" class="big-number">--</div>
  </div>
  <h3>Your Tickets (Auto-Marked)</h3>
  <div id="player-tickets-area"></div>
</div>

<script>
  // --- MEE FIREBASE CONFIG IKADA ADD CHESANU ---
  const firebaseConfig = {
    apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
    authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
    databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
    projectId: "sri-vishnu-priya-finance-c591f",
    storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app",
    messagingSenderId: "184676228358",
    appId: "1:184676228358:web:c2b32b68debeeadadfd287"
  };
  
  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let gameId, playerId, isHost = false;
  let autoPlayTimer = null;
  let allNumbers = [], calledNumbers = [];
  
  // Check if link is for Player
  const urlParams = new URLSearchParams(window.location.search);
  const isPlayerLink = urlParams.has('game') && urlParams.has('player');

  window.onload = () => {
    if (isPlayerLink) {
      joinGameAsPlayer();
    } else {
      document.getElementById('setup-view').style.display = 'block';
    }
    createEmptyBoard('player-board');
  };

  // --- HOST FUNCTIONS ---
  function initHostGame() {
    // Generate Random Game Number
    gameId = Math.floor(1000 + Math.random() * 9000).toString(); 
    document.getElementById('display-game-id').innerText = "Game Number: " + gameId;
    
    // Reset pool
    allNumbers = Array.from({length: 90}, (_, i) => i + 1);
    for (let i = allNumbers.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [allNumbers[i], allNumbers[j]] = [allNumbers[j], allNumbers[i]];
    }

    db.ref('games/' + gameId).set({ status: 'active', currentDraw: 0, called: [0], pool: allNumbers });
    
    document.getElementById('setup-view').style.display = 'none';
    document.getElementById('host-view').style.display = 'block';
    isHost = true;
    listenToGameState();
  }

  function createPlayerLink() {
    let name = document.getElementById('p-name').value.trim();
    let count = parseInt(document.getElementById('p-count').value);
    if(!name || !count) { alert("Enter Name and Ticket Count"); return; }

    let pId = name.replace(/\s+/g, '_') + "_" + Math.floor(Math.random()*1000);
    let tickets = [];
    for(let i=0; i<count; i++) tickets.push(generateTicketArray());

    // Save tickets to Database
    db.ref(`games/${gameId}/tickets/${pId}`).set({ name: name, data: tickets });

    let link = `${window.location.origin}${window.location.pathname}?game=${gameId}&player=${pId}`;
    
    // Check if running locally
    if(window.location.origin === "file://") {
      alert("WARNING: You are opening this file from your computer. The link won't work for others. Upload this file to tiiny.host or Netlify to get a shareable internet link.");
    }

    document.getElementById('link-output').innerHTML = `
      <div class="link-box">
        <strong>Send this link to ${name}:</strong><br><br>
        <a href="${link}" target="_blank">${link}</a><br><br>
        <button class="btn blue" onclick="navigator.clipboard.writeText('${link}'); alert('Link Copied!');">Copy Link</button>
      </div>
    `;
    
    document.getElementById('p-name').value = '';
  }

  function cancelTicket(pId) {
    if(confirm("Are you sure you want to cancel this player's tickets?")) {
      db.ref(`games/${gameId}/tickets/${pId}`).remove();
    }
  }

  function announceVoice(num) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let msg = new SpeechSynthesisUtterance("Number is " + num);
      msg.lang = 'en-IN'; 
      msg.rate = 0.9;
      window.speechSynthesis.speak(msg);
    }
  }

  function drawSingle() {
    if(allNumbers.length === 0) return alert("All numbers drawn!");
    let num = allNumbers.pop();
    calledNumbers.push(num);
    db.ref('games/' + gameId).update({ currentDraw: num, called: calledNumbers, pool: allNumbers });
  }

  function toggleAutoPlay() {
    let btn = document.getElementById('auto-play-btn');
    if (autoPlayTimer) {
      clearInterval(autoPlayTimer); autoPlayTimer = null;
      btn.innerText = "▶ START AUTO PLAY"; btn.classList.remove('red');
    } else {
      drawSingle(); // Draw first immediately
      autoPlayTimer = setInterval(drawSingle, 5000); // Calls every 5 seconds
      btn.innerText = "⏸ STOP AUTO PLAY"; btn.classList.add('red');
    }
  }

  // --- PLAYER FUNCTIONS ---
  function joinGameAsPlayer() {
    gameId = urlParams.get('game');
    playerId = urlParams.get('player');
    document.getElementById('display-game-id').innerText = "Game Number: " + gameId;
    document.getElementById('player-view').style.display = 'block';
    
    db.ref(`games/${gameId}/tickets/${playerId}`).once('value', snapshot => {
      if(snapshot.exists()) {
        document.getElementById('player-welcome-name').innerText = snapshot.val().name + "'s Tickets";
      } else {
        alert("Your tickets were canceled or the game has ended.");
      }
    });
    listenToGameState();
  }

  // --- REAL-TIME SYNC LOGIC ---
  function listenToGameState() {
    db.ref('games/' + gameId).on('value', snapshot => {
      let data = snapshot.val();
      if(!data) return;
      if(!isHost) allNumbers = data.pool || [];
      
      let newNum = data.currentDraw;
      calledNumbers = data.called || [];
      
      if(newNum > 0) {
        if(isHost) document.getElementById('host-current-num').innerText = newNum;
        else document.getElementById('player-current-num').innerText = newNum;
        
        // Voice is triggered ONLY when a NEW number comes from database
        if (newNum !== window.lastAnnouncedNumber) {
          announceVoice(newNum);
          window.lastAnnouncedNumber = newNum;
        }
        
        updateBoard(newNum, calledNumbers);
        markAllTicketsUI(); 
      }
    });

    if(isHost) {
      db.ref(`games/${gameId}/tickets`).on('value', snapshot => {
        document.getElementById('host-tickets-area').innerHTML = '';
        snapshot.forEach(child => {
          renderTickets('host-tickets-area', child.val().data, child.val().name, child.key, true);
        });
        markAllTicketsUI();
      });
    } else {
      db.ref(`games/${gameId}/tickets/${playerId}`).on('value', snapshot => {
        document.getElementById('player-tickets-area').innerHTML = '';
        if(snapshot.exists()) {
          renderTickets('player-tickets-area', snapshot.val().data, snapshot.val().name, null, false);
          markAllTicketsUI();
        } else {
          document.getElementById('player-tickets-area').innerHTML = '<h3 style="color:red; text-align:center;">Tickets Cancelled by Host</h3>';
        }
      });
    }
  }

  // --- UI & TICKET LOGIC ---
  function updateBoard(current, calledArray) {
    for(let i=1; i<=90; i++) {
      let cell = document.getElementById('b-'+i);
      if(cell) {
        cell.className = 'b-cell';
        if(i === current) cell.classList.add('current');
        else if(calledArray.includes(i)) cell.classList.add('called');
      }
    }
  }

  function createEmptyBoard(containerId) {
    let board = document.getElementById(containerId);
    board.innerHTML = '';
    for(let i=1; i<=90; i++) {
      let c = document.createElement('div');
      c.id = 'b-'+i; c.className = 'b-cell'; c.innerText = i;
      board.appendChild(c);
    }
  }

  function markAllTicketsUI() {
    document.querySelectorAll('.t-cell.num').forEach(cell => {
      if(calledNumbers.includes(parseInt(cell.innerText))) cell.classList.add('marked');
    });
  }

  function renderTickets(containerId, ticketsArray, name, pId, isHostView) {
    let container = document.getElementById(containerId);
    ticketsArray.forEach((tData, index) => {
      let wrap = document.createElement('div'); wrap.className = 'ticket-wrap';
      let headHTML = `<span>${name} - Ticket ${index+1}</span>`;
      if(isHostView) headHTML += `<button class="cancel-btn" onclick="cancelTicket('${pId}')">CANCEL TICKET</button>`;
      
      let head = document.createElement('div'); head.className = 't-head'; head.innerHTML = headHTML;
      let grid = document.createElement('div'); grid.className = 't-grid';
      
      for(let r=0; r<3; r++) {
        for(let c=0; c<9; c++) {
          let cell = document.createElement('div');
          if(tData[r][c] === 0) { cell.className = 't-cell empty'; } 
          else { cell.className = 't-cell num'; cell.innerText = tData[r][c]; }
          grid.appendChild(cell);
        }
      }
      wrap.appendChild(head); wrap.appendChild(grid); container.appendChild(wrap);
    });
  }

  function generateTicketArray() {
    let ticket = Array.from({ length: 3 }, () => Array(9).fill(0));
    let colRanges = [[1,9],[10,19],[20,29],[30,39],[40,49],[50,59],[60,69],[70,79],[80,90]];
    let colCounts = Array(9).fill(0);
    
    for (let r = 0; r < 3; r++) {
      let pickedCols = [], numbersInRow = 0;
      let remainingCols = colRanges.map((_, i) => colCounts[i] === 0 ? i : -1).filter(i => i !== -1);
      while (numbersInRow < 5) {
        let colIdx = (remainingCols.length > 0 && numbersInRow < remainingCols.length) ? remainingCols[numbersInRow] : Math.floor(Math.random() * 9);
        if (!pickedCols.includes(colIdx) && colCounts[colIdx] < 3) {
          pickedCols.push(colIdx); colCounts[colIdx]++; numbersInRow++;
          remainingCols = remainingCols.filter(i => i !== colIdx);
        }
      }
      pickedCols.sort((a,b) => a-b).forEach(c => {
        let num;
        do { num = Math.floor(Math.random() * (colRanges[c][1] - colRanges[c][0] + 1)) + colRanges[c][0]; } 
        while (ticket[0][c] === num || ticket[1][c] === num || ticket[2][c] === num); 
        ticket[r][c] = num;
      });
    }
    for (let c = 0; c < 9; c++) {
      let colNums = [];
      for (let r = 0; r < 3; r++) if (ticket[r][c] !== 0) colNums.push(ticket[r][c]);
      if(colNums.length > 1) { colNums.sort((a,b) => a-b); let vIdx = 0; for (let r = 0; r < 3; r++) if (ticket[r][c] !== 0) ticket[r][c] = colNums[vIdx++]; }
    }
    return ticket;
  }
</script>
</body>
</html>
