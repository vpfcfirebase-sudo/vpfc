<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPFC - My Attendance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-bg: #f0f2f5; --brand-color: #0c2046; --brand-gradient: linear-gradient(135deg, #0B3B60 0%, #1a5276 100%);
            --accent-color: #E2A03F; --card-bg: #ffffff; --text-main: #111827; --text-muted: #4b5563;
            --success: #27ae60; --danger: #e74c3c; --warning: #f59e0b; --border-color: #e5e7eb; --input-bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-main); -webkit-tap-highlight-color: transparent; }

        .top-nav { background: var(--brand-gradient); padding: 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: white; display: flex; align-items: center; gap: 15px;}
        .back-btn { display: inline-flex; align-items: center; justify-content: center; width: 35px; height: 35px; font-size: 16px; color: white; background: rgba(255,255,255,0.2); border-radius: 10px; text-decoration: none; }
        .header-title { font-size: 18px; font-weight: 700; color: var(--accent-color); }

        .container { padding: 20px; }

        .status-card { background: var(--card-bg); padding: 25px; border-radius: 16px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .status-icon { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; margin: 0 auto 15px auto; transition: 0.3s;}
        
        .status-offline .status-icon { background: #fee2e2; color: var(--danger); box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }
        .status-offline h2 { color: var(--danger); }
        
        .status-online .status-icon { background: #dcfce7; color: var(--success); box-shadow: 0 0 20px rgba(39, 174, 96, 0.2); }
        .status-online h2 { color: var(--success); }

        .status-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 5px; text-transform: uppercase;}
        .status-card p { font-size: 13px; font-weight: 600; color: var(--text-muted); }

        .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .time-box { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }
        .time-box i { font-size: 20px; color: var(--brand-color); margin-bottom: 8px; display: block; }
        .time-box span { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 5px; }
        .time-box b { font-size: 16px; font-weight: 800; color: var(--text-main); }

        .btn-punch { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-punch:active { transform: scale(0.98); }
        
        .btn-in { background: var(--success); }
        .btn-out { background: var(--danger); display: none; }

        .gps-alert { text-align: center; font-size: 12px; font-weight: 700; color: var(--brand-color); margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 5px; background: #e0f2fe; padding: 10px; border-radius: 8px; border: 1px solid #bae6fd;}

        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <i class="fas fa-satellite fa-spin" style="font-size: 40px; color: var(--brand-color); margin-bottom: 15px;"></i>
        <h3 id="loaderText" style="color:var(--text-main); font-size: 16px;">Acquiring GPS Signal...</h3>
    </div>

    <div class="top-nav">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="header-title">My Attendance</div>
    </div>

    <div class="container">
        
        <div class="status-card status-offline" id="statusCard">
            <div class="status-icon" id="statusIcon"><i class="fas fa-power-off"></i></div>
            <h2 id="statusText">OFFLINE</h2>
            <p id="dateDisplay">--</p>
        </div>

        <div class="time-grid">
            <div class="time-box">
                <i class="fas fa-sign-in-alt" style="color:var(--success);"></i>
                <span>Duty Started</span>
                <b id="timeIn">--:--</b>
            </div>
            <div class="time-box">
                <i class="fas fa-sign-out-alt" style="color:var(--danger);"></i>
                <span>Duty Ended</span>
                <b id="timeOut">--:--</b>
            </div>
        </div>

        <button class="btn-punch btn-in" id="btnPunchIn" onclick="handlePunch('IN')">
            <i class="fas fa-fingerprint"></i> PUNCH IN (Start Duty)
        </button>
        
        <button class="btn-punch btn-out" id="btnPunchOut" onclick="handlePunch('OUT')">
            <i class="fas fa-power-off"></i> PUNCH OUT (End Duty)
        </button>

        <div class="gps-alert">
            <i class="fas fa-map-marker-alt"></i> Location must be ON to Punch In / Out
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        window.db = db;
        window.firebaseDbRef = ref;
        window.firebaseDbGet = get;
        window.firebaseDbChild = child;
        window.firebaseDbUpdate = update;

        window.currentEmpId = null;
        
        const todayObj = new Date();
        const yyyy = todayObj.getFullYear();
        const mm = String(todayObj.getMonth() + 1).padStart(2, '0');
        const dd = String(todayObj.getDate()).padStart(2, '0');
        
        window.monthStr = `${yyyy}-${mm}`;
        window.dateStr = `${yyyy}-${mm}-${dd}`;
        
        // Display Date
        const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('dateDisplay').innerText = todayObj.toLocaleDateString('en-US', options);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentEmpId = user.email.split('@')[0];
                checkAttendanceStatus();
            } else {
                window.location.href = "index.html"; 
            }
        });

        async function checkAttendanceStatus() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loaderText').innerText = "Loading Status...";
            
            try {
                const attRef = window.firebaseDbChild(window.firebaseDbRef(window.db), `attendance/${window.currentEmpId}/${window.monthStr}/${window.dateStr}`);
                const snap = await window.firebaseDbGet(attRef);
                
                if (snap.exists()) {
                    const data = snap.val();
                    
                    if (data.onlineTime) {
                        document.getElementById('timeIn').innerText = data.onlineTime;
                    }
                    if (data.offlineTime) {
                        document.getElementById('timeOut').innerText = data.offlineTime;
                    }

                    // Update UI based on status
                    if (data.onlineTime && !data.offlineTime) {
                        // Currently Online
                        setUIState('ONLINE');
                    } else if (data.onlineTime && data.offlineTime) {
                        // Duty Completed
                        setUIState('COMPLETED');
                    } else {
                        // Not started
                        setUIState('OFFLINE');
                    }
                } else {
                    setUIState('OFFLINE');
                }
            } catch (error) {
                console.error(error);
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function setUIState(state) {
            const card = document.getElementById('statusCard');
            const icon = document.getElementById('statusIcon');
            const text = document.getElementById('statusText');
            const btnIn = document.getElementById('btnPunchIn');
            const btnOut = document.getElementById('btnPunchOut');

            if (state === 'ONLINE') {
                card.className = 'status-card status-online';
                icon.innerHTML = '<i class="fas fa-broadcast-tower"></i>';
                text.innerText = 'ONLINE (ON DUTY)';
                btnIn.style.display = 'none';
                btnOut.style.display = 'flex';
            } else if (state === 'OFFLINE') {
                card.className = 'status-card status-offline';
                icon.innerHTML = '<i class="fas fa-power-off"></i>';
                text.innerText = 'OFFLINE';
                btnIn.style.display = 'flex';
                btnOut.style.display = 'none';
            } else if (state === 'COMPLETED') {
                card.className = 'status-card status-offline';
                icon.innerHTML = '<i class="fas fa-check-circle" style="color:var(--success);"></i>';
                text.innerText = 'DUTY COMPLETED';
                btnIn.style.display = 'none';
                btnOut.style.display = 'none';
            }
        }

        window.handlePunch = function(type) {
            if (!("geolocation" in navigator)) {
                alert("GPS is not supported on this device.");
                return;
            }

            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loaderText').innerText = "Acquiring Strict GPS Location...";

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    await savePunchData(type, lat, lng);
                },
                (error) => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    alert("🔴 GPS ERROR: Failed to get Location. Please turn on Location services and Allow Permissions.");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function savePunchData(type, lat, lng) {
            document.getElementById('loaderText').innerText = "Saving Attendance...";
            
            try {
                const timeStr = new Date().toLocaleTimeString();
                const attPath = `attendance/${window.currentEmpId}/${window.monthStr}/${window.dateStr}`;
                const attRef = window.firebaseDbRef(window.db, attPath);
                
                let updateData = {};

                if (type === 'IN') {
                    updateData = {
                        onlineTime: timeStr,
                        startLat: lat,
                        startLng: lng,
                        currentLat: lat,
                        currentLng: lng,
                        date: window.dateStr
                    };
                    
                    // Also update live tracking node immediately
                    await window.firebaseDbUpdate(window.firebaseDbRef(window.db, `liveLocations/${window.currentEmpId}`), {
                        lat: lat, lng: lng, time: timeStr, status: "Online", lastUpdated: Date.now()
                    });

                } else if (type === 'OUT') {
                    updateData = {
                        offlineTime: timeStr,
                        offlineLat: lat,
                        offlineLng: lng,
                        currentLat: lat,
                        currentLng: lng
                    };
                    
                    // Mark live tracking as offline
                    await window.firebaseDbUpdate(window.firebaseDbRef(window.db, `liveLocations/${window.currentEmpId}`), {
                        status: "Offline", time: timeStr, lastUpdated: Date.now()
                    });
                }

                await window.firebaseDbUpdate(attRef, updateData);
                
                document.getElementById('loadingOverlay').style.display = 'none';
                alert(`Successfully Punched ${type}!`);
                checkAttendanceStatus();

            } catch (error) {
                console.error(error);
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("Error saving attendance. Try again.");
            }
        }
    </script>
</body>
</html>
