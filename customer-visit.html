<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPFC - Customer Visit Submission</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-bg: #f0f2f5; --brand-color: #0c2046; --brand-gradient: linear-gradient(135deg, #0B3B60 0%, #1a5276 100%);
            --accent-color: #E2A03F; --card-bg: #ffffff; --text-main: #111827; --text-muted: #4b5563;
            --success: #27ae60; --danger: #e74c3c; --warning: #f59e0b; --border-color: #e5e7eb; --input-bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-main); -webkit-tap-highlight-color: transparent; padding-bottom: 30px;}

        .top-nav { background: var(--brand-gradient); padding: 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: white; display: flex; align-items: center; gap: 15px;}
        .back-btn { display: inline-flex; align-items: center; justify-content: center; width: 35px; height: 35px; font-size: 16px; color: white; background: rgba(255,255,255,0.2); border-radius: 10px; text-decoration: none; }
        .header-title { font-size: 18px; font-weight: 700; color: var(--accent-color); }

        .form-container { background: var(--card-bg); margin: 20px; border-radius: 16px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 12px; font-weight: 800; color: var(--brand-color); margin-bottom: 6px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; font-weight: 600; background-color: var(--input-bg); color: var(--text-main); outline: none; transition: 0.2s; }
        .form-control:focus { border-color: var(--brand-color); background: white; }

        /* Camera Upload Styles */
        .file-upload-box { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 15px; text-align: center; background: #f8fafc; position: relative; cursor: pointer; transition: 0.2s; margin-bottom: 10px;}
        .file-upload-box i { font-size: 24px; color: var(--brand-color); margin-bottom: 5px; }
        .file-upload-box p { font-size: 11px; font-weight: 700; color: var(--text-muted); margin: 0; }
        .file-upload-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-box.success { border-color: var(--success); background: #f0fdf4; color: var(--success); }
        .file-upload-box.success i, .file-upload-box.success p { color: var(--success); }

        /* Radio Buttons */
        .radio-group { display: flex; gap: 10px; }
        .radio-btn { flex: 1; position: relative; }
        .radio-btn input { display: none; }
        .radio-label { display: block; padding: 10px; text-align: center; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; background: var(--input-bg); transition: 0.2s; }
        .radio-btn input:checked + .radio-label { background: var(--brand-color); color: white; border-color: var(--brand-color); }

        /* Status colors for main radio */
        #stat_paid:checked + .radio-label { background: var(--success); border-color: var(--success); color: white;}
        #stat_notpaid:checked + .radio-label { background: var(--danger); border-color: var(--danger); color: white;}
        #stat_seizing:checked + .radio-label { background: var(--warning); border-color: var(--warning); color: white;}

        .btn-submit { width: 100%; padding: 15px; background: var(--brand-gradient); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(11, 59, 96, 0.3); }

        /* Sections Hidden by Default */
        #paidSection, #notPaidSection, #seizeSection, #houseVisitQn, #photoSection { display: none; }

        /* GPS Status */
        .gps-status { text-align: center; font-size: 12px; font-weight: 800; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .gps-searching { color: var(--warning); }
        .gps-locked { color: var(--success); }

        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 40px; color: var(--brand-color); margin-bottom: 15px;"></i>
        <h3 id="loaderText" style="color:var(--text-main); font-size: 16px;">Acquiring Live GPS & Saving...</h3>
    </div>

    <div class="top-nav">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="header-title">Customer Visit Form</div>
    </div>

    <div class="form-container">
        
        <!-- CUSTOMER DETAILS -->
        <div class="form-group">
            <label class="form-label">Customer Name</label>
            <input type="text" id="custName" class="form-control" placeholder="Enter Customer Name">
        </div>
        <div class="form-group">
            <label class="form-label">HP / Account No.</label>
            <input type="text" id="hpNumber" class="form-control" placeholder="e.g., 90123" style="text-transform: uppercase;">
        </div>

        <!-- MAIN STATUS -->
        <div class="form-group" style="margin-top: 25px;">
            <label class="form-label">Visit Status</label>
            <div class="radio-group">
                <div class="radio-btn">
                    <input type="radio" name="visitStatus" id="stat_paid" value="PAID" onchange="handleStatusChange()">
                    <label class="radio-label" for="stat_paid">PAID</label>
                </div>
                <div class="radio-btn">
                    <input type="radio" name="visitStatus" id="stat_notpaid" value="NOT PAID" onchange="handleStatusChange()">
                    <label class="radio-label" for="stat_notpaid">NOT PAID</label>
                </div>
                <div class="radio-btn">
                    <input type="radio" name="visitStatus" id="stat_seizing" value="SEIZING" onchange="handleStatusChange()">
                    <label class="radio-label" for="stat_seizing">SEIZING</label>
                </div>
            </div>
        </div>

        <!-- ================= PAID SECTION ================= -->
        <div id="paidSection">
            <div class="form-group">
                <label class="form-label">Payment Method</label>
                <select id="payMethod" class="form-control" onchange="handlePaymentMethodChange()">
                    <option value="">-- Select --</option>
                    <option value="PCR">PCR (Cash Receipt)</option>
                    <option value="Office QR">Office QR</option>
                    <option value="OP">OP (Online Payment)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Amount Collected (₹)</label>
                <input type="number" id="collectedAmt" class="form-control" placeholder="Enter Amount">
            </div>

            <!-- YES/NO QUESTION FOR QR & OP -->
            <div class="form-group" id="houseVisitQn">
                <label class="form-label">Did you visit the customer's house?</label>
                <div class="radio-group">
                    <div class="radio-btn">
                        <input type="radio" name="houseVisited" id="visit_yes" value="YES" onchange="handleHouseVisitChange()">
                        <label class="radio-label" for="visit_yes">Yes, Visited</label>
                    </div>
                    <div class="radio-btn">
                        <input type="radio" name="houseVisited" id="visit_no" value="NO" onchange="handleHouseVisitChange()">
                        <label class="radio-label" for="visit_no">No, Didn't Visit</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= NOT PAID SECTION ================= -->
        <div id="notPaidSection">
            <div class="form-group">
                <label class="form-label">Reason for Not Paying</label>
                <textarea id="npReason" class="form-control" rows="2" placeholder="Write specific reason..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Promise To Pay (PTP) Date</label>
                <input type="date" id="npDate" class="form-control">
            </div>
        </div>

        <!-- ================= SEIZING SECTION ================= -->
        <div id="seizeSection">
            <div class="form-group">
                <label class="form-label">Seizing Remarks / Reason</label>
                <textarea id="szReason" class="form-control" rows="2" placeholder="Write remarks..."></textarea>
            </div>
        </div>

        <!-- ================= DYNAMIC CAMERA UPLOADS ================= -->
        <!-- Note: capture="environment" forces the rear camera and blocks gallery on mobile devices -->
        <div id="photoSection" style="margin-top: 25px;">
            <label class="form-label" style="border-bottom: 2px solid var(--border-color); padding-bottom: 5px; margin-bottom: 15px;"><i class="fas fa-camera"></i> Live Camera Uploads</label>
            
            <!-- PCR Receipt (Only for PCR) -->
            <div class="file-upload-box" id="box_pcrReceipt" style="display:none;">
                <i class="fas fa-receipt"></i>
                <p id="lbl_pcrReceipt">Take PCR Receipt Photo</p>
                <input type="file" id="img_pcrReceipt" accept="image/*" capture="environment" onchange="markUploaded('box_pcrReceipt', 'lbl_pcrReceipt')">
            </div>

            <!-- Customer Photo -->
            <div class="file-upload-box" id="box_custPhoto" style="display:none;">
                <i class="fas fa-user-check"></i>
                <p id="lbl_custPhoto">Take Customer Photo</p>
                <input type="file" id="img_custPhoto" accept="image/*" capture="environment" onchange="markUploaded('box_custPhoto', 'lbl_custPhoto')">
            </div>

            <!-- House/Vehicle Photo -->
            <div class="file-upload-box" id="box_housePhoto" style="display:none;">
                <i class="fas fa-home"></i>
                <p id="lbl_housePhoto">Take House / Vehicle Photo</p>
                <input type="file" id="img_housePhoto" accept="image/*" capture="environment" onchange="markUploaded('box_housePhoto', 'lbl_housePhoto')">
            </div>

            <!-- Bike Photos (Only for Seizing) -->
            <div class="file-upload-box" id="box_bike1" style="display:none;">
                <i class="fas fa-motorcycle"></i>
                <p id="lbl_bike1">Take Bike Photo 1</p>
                <input type="file" id="img_bike1" accept="image/*" capture="environment" onchange="markUploaded('box_bike1', 'lbl_bike1')">
            </div>
            <div class="file-upload-box" id="box_bike2" style="display:none;">
                <i class="fas fa-motorcycle"></i>
                <p id="lbl_bike2">Take Bike Photo 2</p>
                <input type="file" id="img_bike2" accept="image/*" capture="environment" onchange="markUploaded('box_bike2', 'lbl_bike2')">
            </div>
        </div>

        <button class="btn-submit" onclick="submitVisitData()"><i class="fas fa-paper-plane"></i> Submit Visit Report</button>
        <div class="gps-status gps-searching" id="gpsStatus"><i class="fas fa-satellite"></i> GPS Required to Submit</div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const storage = getStorage(app);
        
        window.currentEmpId = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentEmpId = user.email.split('@')[0];
            } else {
                window.location.href = "index.html"; 
            }
        });

        // UI Logic Variables
        const secPaid = document.getElementById('paidSection');
        const secNotPaid = document.getElementById('notPaidSection');
        const secSeize = document.getElementById('seizeSection');
        const secPhotos = document.getElementById('photoSection');
        const qnHouse = document.getElementById('houseVisitQn');

        // Photo Boxes
        const boxPcr = document.getElementById('box_pcrReceipt');
        const boxCust = document.getElementById('box_custPhoto');
        const boxHouse = document.getElementById('box_housePhoto');
        const boxBike1 = document.getElementById('box_bike1');
        const boxBike2 = document.getElementById('box_bike2');

        // File Inputs
        const imgPcr = document.getElementById('img_pcrReceipt');
        const imgCust = document.getElementById('img_custPhoto');
        const imgHouse = document.getElementById('img_housePhoto');
        const imgBike1 = document.getElementById('img_bike1');
        const imgBike2 = document.getElementById('img_bike2');

        function hideAllPhotos() {
            boxPcr.style.display = 'none';
            boxCust.style.display = 'none';
            boxHouse.style.display = 'none';
            boxBike1.style.display = 'none';
            boxBike2.style.display = 'none';
            
            // Reset files
            imgPcr.value = ''; imgCust.value = ''; imgHouse.value = ''; imgBike1.value = ''; imgBike2.value = '';
            document.querySelectorAll('.file-upload-box').forEach(b => { b.classList.remove('success'); });
            document.getElementById('lbl_pcrReceipt').innerText = 'Take PCR Receipt Photo';
            document.getElementById('lbl_custPhoto').innerText = 'Take Customer Photo';
            document.getElementById('lbl_housePhoto').innerText = 'Take House / Vehicle Photo';
            document.getElementById('lbl_bike1').innerText = 'Take Bike Photo 1';
            document.getElementById('lbl_bike2').innerText = 'Take Bike Photo 2';
        }

        window.markUploaded = function(boxId, lblId) {
            document.getElementById(boxId).classList.add('success');
            document.getElementById(lblId).innerText = 'Photo Captured Successfully!';
        }

        window.handleStatusChange = function() {
            const status = document.querySelector('input[name="visitStatus"]:checked').value;
            secPaid.style.display = 'none';
            secNotPaid.style.display = 'none';
            secSeize.style.display = 'none';
            secPhotos.style.display = 'block';
            qnHouse.style.display = 'none';
            
            hideAllPhotos();
            document.getElementById('payMethod').value = '';

            if (status === 'PAID') {
                secPaid.style.display = 'block';
            } else if (status === 'NOT PAID') {
                secNotPaid.style.display = 'block';
                // Not Paid Requires ONLY House Photo
                boxHouse.style.display = 'block';
            } else if (status === 'SEIZING') {
                secSeize.style.display = 'block';
                // Seizing requires ONLY 2 Bike Photos
                boxBike1.style.display = 'block';
                boxBike2.style.display = 'block';
            }
        }

        window.handlePaymentMethodChange = function() {
            const method = document.getElementById('payMethod').value;
            hideAllPhotos();
            qnHouse.style.display = 'none';
            document.querySelectorAll('input[name="houseVisited"]').forEach(r => r.checked = false);

            if (method === 'PCR') {
                // PCR Requirements
                boxPcr.style.display = 'block';
                boxCust.style.display = 'block';
                boxHouse.style.display = 'block';
            } else if (method === 'Office QR' || method === 'OP') {
                // Ask Question
                qnHouse.style.display = 'block';
            }
        }

        window.handleHouseVisitChange = function() {
            const visited = document.querySelector('input[name="houseVisited"]:checked').value;
            hideAllPhotos(); // Clear old selections
            if (visited === 'YES') {
                boxCust.style.display = 'block';
                boxHouse.style.display = 'block';
            }
        }

        // =====================================
        // STRICT GPS & SUBMISSION ENGINE
        // =====================================
        window.submitVisitData = function() {
            // Basic Validation
            const hp = document.getElementById('hpNumber').value.trim().toUpperCase();
            const cname = document.getElementById('custName').value.trim();
            const statNode = document.querySelector('input[name="visitStatus"]:checked');
            
            if(!hp || !cname) return alert("Please enter Customer Name and HP Number!");
            if(!statNode) return alert("Please select a Visit Status!");
            
            const status = statNode.value;

            // Deep Validation Based on Logic
            if (status === 'PAID') {
                const method = document.getElementById('payMethod').value;
                const amt = document.getElementById('collectedAmt').value;
                if(!method || !amt) return alert("Select Payment Method and Enter Amount!");
                
                if (method === 'PCR') {
                    if(!imgPcr.files[0] || !imgCust.files[0] || !imgHouse.files[0]) return alert("Please capture PCR Receipt, Customer, and House Photos!");
                } else {
                    const visitQn = document.querySelector('input[name="houseVisited"]:checked');
                    if(!visitQn) return alert("Please select if you visited the customer's house!");
                    if(visitQn.value === 'YES') {
                        if(!imgCust.files[0] || !imgHouse.files[0]) return alert("Please capture Customer and House Photos!");
                    }
                }
            } else if (status === 'NOT PAID') {
                if(!document.getElementById('npReason').value.trim()) return alert("Enter reason for Not Paying!");
                if(!imgHouse.files[0]) return alert("Please capture House Photo!");
            } else if (status === 'SEIZING') {
                if(!document.getElementById('szReason').value.trim()) return alert("Enter Seizing Remarks!");
                if(!imgBike1.files[0] || !imgBike2.files[0]) return alert("Please capture both Bike Photos!");
            }

            // GET EXACT LIVE GPS (Mandatory)
            document.getElementById('loaderText').innerText = "Acquiring GPS Signal...";
            document.getElementById('loadingOverlay').style.display = 'flex';

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        processUploadsAndSave(lat, lng, status);
                    },
                    (error) => {
                        document.getElementById('loadingOverlay').style.display = 'none';
                        alert("GPS ERROR: Could not get your location. Please turn on Location/GPS and try again!");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("GPS is not supported on this device/browser.");
            }
        }

        async function processUploadsAndSave(lat, lng, status) {
            document.getElementById('loaderText').innerText = "Uploading Photos & Saving Data...";
            
            const visitId = Date.now().toString();
            const today = new Date();
            const dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            const monthStr = dateStr.substring(0, 7);
            const timeStr = today.toLocaleTimeString();

            let uploadPromises = [];
            let urls = { pcr: 'N/A', cust: 'N/A', house: 'N/A', bike1: 'N/A', bike2: 'N/A' };

            // Helper to upload
            const uploadFile = async (fileObj, path, key) => {
                if(fileObj) {
                    const imgRef = sRef(storage, `visit_proofs/${monthStr}/${visitId}_${path}.jpg`);
                    await uploadBytes(imgRef, fileObj);
                    urls[key] = await getDownloadURL(imgRef);
                }
            };

            try {
                if(status === 'PAID') {
                    await uploadFile(imgPcr.files[0], 'pcr', 'pcr');
                    await uploadFile(imgCust.files[0], 'cust', 'cust');
                    await uploadFile(imgHouse.files[0], 'house', 'house');
                } else if(status === 'NOT PAID') {
                    await uploadFile(imgHouse.files[0], 'house', 'house');
                } else if(status === 'SEIZING') {
                    await uploadFile(imgBike1.files[0], 'bike1', 'bike1');
                    await uploadFile(imgBike2.files[0], 'bike2', 'bike2');
                }

                // Prepare Data Object
                let visitData = {
                    vid: visitId,
                    eid: window.currentEmpId,
                    hp: document.getElementById('hpNumber').value.trim().toUpperCase(),
                    cname: document.getElementById('custName').value.trim(),
                    stat: status,
                    date: dateStr,
                    time: timeStr,
                    timestamp: Date.now(),
                    lat: lat,
                    lng: lng
                };

                if(status === 'PAID') {
                    visitData.type = document.getElementById('payMethod').value;
                    visitData.amt = document.getElementById('collectedAmt').value;
                    visitData.pcrUrl = urls.pcr;
                    visitData.custUrl = urls.cust;
                    visitData.houseUrl = urls.house;
                    
                    const visited = document.querySelector('input[name="houseVisited"]:checked');
                    if(visited) visitData.houseVisited = visited.value;

                    // Set primary photoUrl for timeline display
                    if(urls.pcr !== 'N/A') visitData.photoUrl = urls.pcr;
                    else if(urls.house !== 'N/A') visitData.photoUrl = urls.house;

                } else if(status === 'NOT PAID') {
                    visitData.unr = document.getElementById('npReason').value.trim();
                    visitData.next = document.getElementById('npDate').value;
                    visitData.houseUrl = urls.house;
                    visitData.photoUrl = urls.house; // For timeline display
                } else if(status === 'SEIZING') {
                    visitData.seizeRsn = document.getElementById('szReason').value.trim();
                    visitData.bike1Url = urls.bike1;
                    visitData.bike2Url = urls.bike2;
                    visitData.photoUrl = urls.bike1; // For timeline display
                }

                // Save to Firebase
                await set(ref(db, `visits/${monthStr}/${visitId}`), visitData);

                document.getElementById('loadingOverlay').style.display = 'none';
                alert("Visit Report Submitted Successfully!");
                window.location.href = "my-history.html"; // Redirect to history to see the new entry

            } catch (error) {
                console.error(error);
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("Error saving data. Please check internet connection.");
            }
        }
    </script>
</body>
</html>
