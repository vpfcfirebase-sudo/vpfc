<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sri Vishnu Priya Finance - Customer Visit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-bg: #f0f2f5; --brand-color: #0c2046; --brand-gradient: linear-gradient(135deg, #0B3B60 0%, #1a5276 100%);
            --accent-color: #E2A03F; --card-bg: #ffffff; --text-main: #111827; --text-muted: #4b5563;
            --success: #27ae60; --danger: #e74c3c; --border-color: #e5e7eb; --input-bg: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', Arial, sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-main); -webkit-tap-highlight-color: transparent; }

        .top-nav { background: var(--brand-gradient); padding: 20px 20px 25px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: white; }
        .header-top-row { display: flex; justify-content: space-between; align-items: center; }
        .header-content h1 { font-size: 18px; font-weight: 700; color: var(--accent-color); margin: 0; }
        
        .action-bar { padding: 15px 20px; display: flex; align-items: center; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--brand-color); background: var(--card-bg); padding: 10px 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-decoration: none; border: 1px solid var(--border-color); }

        .form-container { padding: 0 20px 30px 20px; }
        .section-title { font-size: 13px; font-weight: 800; color: var(--brand-color); margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; }
        
        .accounts-scroll { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
        .accounts-scroll::-webkit-scrollbar { display: none; }
        .acc-chip { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 12px; min-width: 120px; flex-shrink: 0; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .acc-chip.active { border-color: var(--brand-color); background: #e0f2fe; }
        .acc-hp { font-weight: 800; font-size: 14px; color: var(--brand-color); }
        .acc-amt { font-size: 12px; color: var(--success); font-weight: 600; margin-top: 3px; }
        
        .info-card { background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; }
        .info-card h4 { color: #b45309; font-size: 13px; margin-bottom: 5px; }
        .info-card p { font-size: 12px; color: #92400e; font-weight: 600; }

        .card-box { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        .input-group input, .input-group select { width: 100%; padding: 12px 15px; border: 1.5px solid var(--border-color); border-radius: 10px; font-size: 14px; background-color: var(--input-bg); color: var(--text-main); font-weight: 600; outline: none; }
        .input-group input:focus, .input-group select:focus { border-color: var(--brand-color); }
        
        .file-upload { border: 2px dashed var(--border-color); padding: 15px; text-align: center; border-radius: 10px; background: var(--input-bg); cursor: pointer; position: relative; overflow: hidden; }
        .file-upload input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload i { font-size: 20px; color: var(--brand-color); margin-bottom: 5px; }
        .file-upload span { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); }

        #paidSection, #notPaidSection, #seizingSection { display: none; }
        
        .btn-submit { width: 100%; padding: 15px; background: var(--success); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3); }
        .btn-submit:active { transform: scale(0.98); }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .loader-spinner { font-size: 40px; color: var(--brand-color); margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="header-top-row">
            <div class="header-content">
                <h1>SRI VISHNU PRIYA</h1>
                <div style="font-size: 13px; opacity: 0.9; margin-top:3px; font-weight: 600;" id="user-display-email">Customer Visit</div>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <!-- STRICT LOADING GATEKEEPER -->
    <div id="attendanceLoader" style="text-align: center; padding: 40px 20px; font-weight: 700; color: var(--brand-color); font-size: 15px;">
        <i class="fas fa-shield-alt" style="font-size: 24px; margin-bottom:10px; display:block;"></i>
        Verifying Attendance Status...

    <!-- MAIN FORM (HIDDEN UNTIL VERIFIED) -->

        <div class="section-title">Your Assigned Accounts <span id="monthDisplay"></span></div>
        <div class="accounts-scroll" id="accountsList">

        <div class="card-box">

            </div>

                <label style="color:var(--brand-color); font-size:14px;">Select Visit Status</label>
                <select id="visitStatus" onchange="handleStatusChange()">
                    <option value="">-- Select Status --</option>

        </div>

        <!-- === PAID SECTION === -->
        <div class="card-box" id="paidSection">
            <div class="input-group">
                <label>Amount Paid (₹)</label>

            </div>
            <div class="input-group">
                <label>Payment Mode</label>
                <select id="paymentMode" onchange="handlePaymentMode()">

                    <option value="LOCK">Lock Amount</option>
                    <option value="QR">Office QR</option>

            <div id="lockFields" style="display: none; background: #f1f5f9; padding:10px; border-radius:8px; margin-bottom:15px;">

                    <label>Reason for no PPFC entry</label>

            <div id="opFields" style="display: none; background: #f1f5f9; padding:10px; border-radius:8px; margin-bottom:15px;">

                </div>

                    <label>Extra Screenshot 1</label>
                    <input type="file" id="imgExtra1" accept="image/*" style="padding: 8px;">
                </div>
                <div class="input-group">
                    <label>Extra Screenshot 2</label>
                    <input type="file" id="imgExtra2" accept="image/*" style="padding: 8px;">

        <!-- === NOT PAID SECTION === -->
        <div class="card-box" id="notPaidSection">

            </div>

    <!-- Loading Overlay -->

        <i class="fas fa-spinner fa-spin loader-spinner"></i>
        <h3 style="color:var(--brand-color);" id="loadingText">Processing...</h3>
        <p style="font-size:12px; color:var(--text-muted); margin-top:5px;">Please wait, compressing images...</p>
    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        // IMPORT UPDATE TO TRACK KILOMETERS SAFELY
        import { getDatabase, ref, get, child, set, push, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const storage = getStorage(app);
        
        window.db = db;
        window.storage = storage;
        window.firebaseDbRef = ref;
        window.firebaseDbGet = get;
        window.firebaseDbChild = child;
        window.firebaseDbSet = set;
        window.firebaseDbPush = push;
        window.firebaseDbUpdate = update; // Exporting update logic
        window.firebaseStorageRef = storageRef;
        window.firebaseUploadBytes = uploadBytes;
        window.firebaseGetDownloadURL = getDownloadURL;
        
        window.currentEmpId = null;
        window.currentEmpName = "";
        window.currentBranch = "";
        window.currentEmpMobile = "N/A";
        window.selectedAccType = "Regular"; 
        
        const dateObj = new Date();
        const yyyy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        window.currentYearMonth = `${yyyy}-${mm}`;
        window.currentDateOnly = `${yyyy}-${mm}-${dd}`;
        
        document.getElementById('monthDisplay').innerText = `(${window.currentYearMonth})`;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentEmpId = user.email.split('@')[0];

                // === 🚨 STRICT ATTENDANCE GATEKEEPER 🚨 ===
                try {
                    const attSnap = await get(child(ref(db), `attendance/${window.currentEmpId}/${window.currentYearMonth}/${window.currentDateOnly}`));
                    
                    if (attSnap.exists()) {
                        const att = attSnap.val();
                        if (!att.onlineTime || att.offlineTime) {
                            alert("Please go online for duty.");
                            window.location.replace("my-attendance.html");
                            return; 
                        }
                    } else {
                        alert("Please go online for duty.");
                        window.location.replace("my-attendance.html");
                        return; 
                    }
                } catch(e) {
                    alert("Network error while checking attendance!");
                    window.location.replace("dashboard.html");
                    return;
                }

                // Passed check! Show form
                document.getElementById('attendanceLoader').style.display = 'none';
                document.getElementById('mainFormContainer').style.display = 'block';

                try {
                    const snapshot = await get(child(ref(db), `employees/${window.currentEmpId}`));
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        window.currentEmpName = data.name || window.currentEmpId;
                        window.currentBranch = data.branch || "N/A";
                        window.currentEmpMobile = data.mobile || "N/A";
                        document.getElementById('user-display-email').innerText = `Visit Agent: ${window.currentEmpName}`;
                    }
                    loadAssignedAccounts();
                } catch (error) { console.error(error); }
            } else {
                window.location.href = "index.html"; 
            }
        });

        async function loadAssignedAccounts() {
            const listDiv = document.getElementById('accountsList');
            try {
                const snapshot = await get(child(ref(db), `assignments/${window.currentEmpId}/${window.currentYearMonth}/details`));
                if (snapshot.exists()) {
                    listDiv.innerHTML = "";
                    const details = snapshot.val();
                    for(const hp in details) {
                        const amt = details[hp].amt || 0;
                        const type = details[hp].type || "Regular";
                        
                        const chip = document.createElement('div');
                        chip.className = 'acc-chip';
                        chip.innerHTML = `<div class="acc-hp">${hp}</div><div class="acc-amt">₹${amt} (${type})</div>`;
                        chip.onclick = () => selectAccount(hp, chip, type);
                        listDiv.appendChild(chip);
                    }
                } else {
                    listDiv.innerHTML = `<div style="font-size:12px; padding:10px; color:var(--danger);">No accounts assigned for this month.</div>`;
                }
            } catch (error) { console.error(error); }
        }

        // --- ACCOUNT SELECTION ---
        window.selectAccount = async function(hp, chipElement, accType) {
            document.querySelectorAll('.acc-chip').forEach(c => c.classList.remove('active'));
            if(chipElement) chipElement.classList.add('active');
            
            document.getElementById('hpNumber').value = hp;
            window.selectedAccType = accType; 
            
            try {
                const visitsSnap = await get(child(ref(db), `visits/${window.currentYearMonth}`));
                let totalPaid = 0; let latestType = "None";
                if(visitsSnap.exists()) {
                    const visitsData = visitsSnap.val();
                    for(const vId in visitsData) {
                        const v = visitsData[vId];
                        if(v.hp === hp) {
                            totalPaid += (parseInt(v.amt) || 0);
                            latestType = v.type || "None"; 
                        }
                    }
                }
                const balCard = document.getElementById('oldBalanceCard');
                if(totalPaid > 0) {
                    balCard.style.display = 'block';
                    document.getElementById('oldBalanceText').innerText = `Total Paid this month: ₹${totalPaid} | Current Status: ${latestType}`;
                } else {
                    balCard.style.display = 'none';
                }
            } catch(e) { console.error(e); }
        }
    </script>

    <script>
        document.getElementById('imgReceipt').onchange = function() { document.getElementById('imgReceiptName').innerText = this.files[0] ? this.files[0].name : 'Choose File'; }
        document.getElementById('imgCustomer').onchange = function() { document.getElementById('imgCustomerName').innerText = this.files[0] ? this.files[0].name : 'Choose File'; }
        document.getElementById('imgHouse').onchange = function() { document.getElementById('imgHouseName').innerText = this.files[0] ? this.files[0].name : 'Choose File'; }

        function handleStatusChange() {
            const status = document.getElementById('visitStatus').value;
            document.getElementById('paidSection').style.display = (status === 'PAID') ? 'block' : 'none';
            document.getElementById('notPaidSection').style.display = (status === 'NOT PAID') ? 'block' : 'none';
            document.getElementById('seizingSection').style.display = (status === 'SEIZING') ? 'block' : 'none';
            
            document.getElementById('commonPhotos').style.display = (status !== '') ? 'block' : 'none';
            if(status === 'PAID') handlePaymentMode();
        }

        function handlePaymentMode() {
            const mode = document.getElementById('paymentMode').value;
            const lbl = document.getElementById('receiptImgLabel');
            
            document.getElementById('lockFields').style.display = 'none';
            document.getElementById('opFields').style.display = 'none';
            document.getElementById('qrExtraFields').style.display = 'none';
            document.getElementById('receiptImgGroup').style.display = 'block';

            if(mode === 'PCR') lbl.innerText = "PCR Receipt Image";
            else if(mode === 'LOCK') { lbl.innerText = "Lock Receipt / Screenshot"; document.getElementById('lockFields').style.display = 'block'; handlePPFC(); }
            else if(mode === 'QR') { lbl.innerText = "QR Payment Screenshot"; document.getElementById('qrExtraFields').style.display = 'block'; }
            else if(mode === 'OP') { lbl.innerText = "OP Receipt Image"; document.getElementById('opFields').style.display = 'block'; }
        }

        function handlePPFC() {
            const isEntered = document.getElementById('ppfcEntered').value;
            document.getElementById('ppfcReasonBox').style.display = (isEntered === 'No') ? 'block' : 'none';
        }

        // Distance Formula (Haversine)
        function getDistanceKm(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // Image Compressor
        async function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.6) {
            return new Promise((resolve, reject) => {
                if(!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width; let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height = Math.round(height *= maxWidth / width); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round(width *= maxHeight / height); height = maxHeight; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        async function submitVisitData() {
            const hp = document.getElementById('hpNumber').value.trim();
            const status = document.getElementById('visitStatus').value;
            
            if(!hp || !status) { alert("Please select HP Number and Visit Status."); return; }
            if(!document.getElementById('imgCustomer').files[0] || !document.getElementById('imgHouse').files[0]) {
                alert("Customer and House photos are mandatory!"); return;
            }

            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').innerText = "Getting Location...";

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const locStr = `${lat},${lng}`;
                    await processAndUploadData(locStr, lat, lng);
                },
                async (error) => {
                    console.log("GPS Error");
                    await processAndUploadData("Location Denied", 0, 0);
                }, { enableHighAccuracy: true, timeout: 5000 }
            );
        }

        async function uploadImageFile(file, folderPath) {
            if(!file) return "N/A";
            try {
                const compressedFile = await compressImage(file);
                const fileName = `${folderPath}/${Date.now()}_img.jpg`;
                const imgRef = window.firebaseStorageRef(window.storage, fileName);
                await window.firebaseUploadBytes(imgRef, compressedFile);
                return await window.firebaseGetDownloadURL(imgRef);
            } catch (err) {
                return "N/A";
            }
        }

        async function processAndUploadData(locationString, vLat = 0, vLng = 0) {
            document.getElementById('loadingText').innerText = "Uploading Compressed Photos...";
            
            try {
                const hp = document.getElementById('hpNumber').value.trim();
                const status = document.getElementById('visitStatus').value;
                const cname = document.getElementById('custName').value.trim();
                const cmobile = document.getElementById('custMobile').value.trim();
                const carea = document.getElementById('locationArea').value.trim();
                
                const urlCustomer = await uploadImageFile(document.getElementById('imgCustomer').files[0], 'visits/customers');
                const urlHouse = await uploadImageFile(document.getElementById('imgHouse').files[0], 'visits/houses');
                
                document.getElementById('loadingText').innerText = "Saving Data...";

                let visitData = {
                    eid: window.currentEmpId,
                    ename: window.currentEmpName,
                    empMobile: window.currentEmpMobile,
                    branch: window.currentBranch,
                    hp: hp, 
                    accType: window.selectedAccType, 
                    cname: cname, 
                    custMobile: cmobile, 
                    vill: carea,
                    stat: status, 
                    loc: locationString,
                    lat: vLat, // Saving latitude for precise tracking
                    lng: vLng, // Saving longitude for precise tracking
                    time: new Date().toLocaleTimeString(),
                    date: new Date().toISOString().split('T')[0],
                    timestamp: Date.now(),
                    photoCust: urlCustomer, photoHouse: urlHouse
                };

                if(status === 'PAID') {
                    const pMode = document.getElementById('paymentMode').value;
                    visitData.type = pMode;
                    visitData.amt = document.getElementById('paidAmount').value;
                    visitData.receiptUrl = await uploadImageFile(document.getElementById('imgReceipt').files[0], 'visits/receipts');
                    
                    if(pMode === 'LOCK') {
                        visitData.ppfc = document.getElementById('ppfcEntered').value;
                        if(visitData.ppfc === 'No') visitData.ppfcRsn = document.getElementById('ppfcReason').value;
                    }
                    else if(pMode === 'QR') {
                        visitData.exImg1 = await uploadImageFile(document.getElementById('imgExtra1').files[0], 'visits/receipts');
                        visitData.exImg2 = await uploadImageFile(document.getElementById('imgExtra2').files[0], 'visits/receipts');
                    }
                    else if(pMode === 'OP') {
                        visitData.opTo = document.getElementById('opPerson').value;
                        visitData.opReceipt = document.getElementById('opReceiptGiven').value;
                    }
                } 
                else if (status === 'NOT PAID') {
                    visitData.type = "NOT PAID";
                    visitData.unr = document.getElementById('notPaidReason').value;
                    visitData.next = document.getElementById('promisedDate').value;
                } 
                else if (status === 'SEIZING') {
                    visitData.type = "SEIZING";
                    visitData.seizeRsn = document.getElementById('seizeReason').value;
                }

                // 1. Save Visit Data
                const dbRef = window.firebaseDbRef(window.db, `visits/${window.currentYearMonth}`);
                const newVisitRef = window.firebaseDbPush(dbRef);
                await window.firebaseDbSet(newVisitRef, visitData);
                
                // 2. KILOMETER TRACKING UPDATE LOGIC
                if (locationString !== "Location Denied" && vLat !== 0 && vLng !== 0) {
                    try {
                        const attRefPath = `attendance/${window.currentEmpId}/${window.currentYearMonth}/${window.currentDateOnly}`;
                        const attRef = window.firebaseDbRef(window.db, attRefPath);
                        const attSnap = await window.firebaseDbGet(attRef);
                        
                        if (attSnap.exists()) {
                            const attData = attSnap.val();
                            let prevLat = parseFloat(attData.lastLat || attData.startLat);
                            let prevLng = parseFloat(attData.lastLng || attData.startLng);
                            let currentKm = parseFloat(attData.totalKm || 0);
                            
                            if (!isNaN(prevLat) && !isNaN(prevLng)) {
                                let addedKm = getDistanceKm(prevLat, prevLng, vLat, vLng);
                                currentKm += addedKm;
                            }
                            
                            // Update total distance and set new last location in Attendance Node
                            await window.firebaseDbUpdate(attRef, {
                                totalKm: parseFloat(currentKm.toFixed(2)),
                                lastLat: vLat,
                                lastLng: vLng
                            });
                        }
                    } catch(err) {
                        console.error("Distance tracking error:", err);
                    }
                }

                // 3. Send Telegram Notification
                document.getElementById('loadingText').innerText = "Sending Notifications...";
                await sendToTelegram(visitData);

                document.getElementById('loadingOverlay').style.display = 'none';
                alert("Visit Data Submitted Successfully!");
                window.location.reload();

            } catch (error) {
                console.error(error);
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("Error submitting data. Please try again.");
            }
        }

        // --- TELEGRAM MESSAGE LOGIC ---
        async function sendToTelegram(data) {
            try {
                const dbRef = window.firebaseDbRef(window.db);
                let token = null;
                let targetChatIds = new Set(); 

                const adminSnap = await window.firebaseDbGet(window.firebaseDbChild(dbRef, `adminSettings`));
                if (adminSnap.exists()) {
                    token = adminSnap.val().telegramBotToken;
                    if (adminSnap.val().adminChatId) targetChatIds.add(adminSnap.val().adminChatId);
                }

                if (!token) return; 

                if (data.branch && data.branch !== "N/A") {
                    const branchesSnap = await window.firebaseDbGet(window.firebaseDbChild(dbRef, `branches`));
                    if (branchesSnap.exists()) {
                        const branchesData = branchesSnap.val();
                        for (const key in branchesData) {
                            if (branchesData[key].name === data.branch) {
                                if (branchesData[key].chatId && branchesData[key].chatId.trim() !== "") {
                                    targetChatIds.add(branchesData[key].chatId.trim());
                                }
                                break; 
                            }
                        }
                    }
                }

                if (targetChatIds.size > 0) {
                    let msg = `🚨 *New Customer Visit*\n\n`;
                    msg += `👤 *Agent:* ${data.ename} (ID: ${data.eid})\n`;
                    msg += `📱 *Agent Ph:* ${data.empMobile}\n`; 
                    msg += `🏦 *Branch:* ${data.branch}\n`;
                    msg += `📝 *HP No:* ${data.hp} (*${data.accType}*)\n`; 
                    msg += `👤 *Customer Name:* ${data.cname || 'N/A'}\n`;
                    msg += `📞 *Cust Mobile:* ${data.custMobile || 'N/A'}\n`; 
                    
                    if(data.stat === 'PAID') {
                        msg += `\n🟢 *Status:* PAID\n`;
                        msg += `💰 *Amount:* ₹${data.amt}\n`;
                        msg += `💳 *Mode:* ${data.type}\n`;
                    } else if(data.stat === 'NOT PAID') {
                        msg += `\n🔴 *Status:* NOT PAID\n`;
                        msg += `🛑 *Reason:* ${data.unr || 'N/A'}\n`; 
                        msg += `📅 *Next Date:* ${data.next || 'N/A'}\n`; 
                    } else if(data.stat === 'SEIZING') {
                        msg += `\n🟠 *Status:* SEIZING\n`;
                        msg += `🛑 *Remarks:* ${data.seizeRsn || 'N/A'}\n`;
                    }
                    
                    msg += `\n📍 *Location:* [View Map](https://maps.google.com/?q=${data.loc})\n`;
                    msg += `\n📸 *PROOFS:*`;
                    if (data.photoCust && data.photoCust !== "N/A") msg += `\n[👤 Customer Photo](${data.photoCust})`;
                    if (data.photoHouse && data.photoHouse !== "N/A") msg += `\n[🏠 House Photo](${data.photoHouse})`;
                    if (data.receiptUrl && data.receiptUrl !== "N/A") msg += `\n[🧾 Payment Receipt](${data.receiptUrl})`;

                    const tgUrl = `https://api.telegram.org/bot${token}/sendMessage`;

                    for (const chatId of targetChatIds) {
                        await fetch(tgUrl, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ 
                                chat_id: chatId, 
                                text: msg, 
                                parse_mode: "Markdown",
                                disable_web_page_preview: false 
                            })
                        });
                    }
                }
            } catch(e) { console.log("Telegram Error", e); }
        }
    </script>
