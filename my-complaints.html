<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sri Vishnu Priya Finance - My Complaints</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME STYLES --- */
        :root {
            --primary-bg: #f4f7fe; 
            --brand-color: #0c2046; 
            --brand-gradient: linear-gradient(135deg, #0B3B60 0%, #1a5276 100%);
            --accent-color: #E2A03F; 
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', Arial, sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-main); -webkit-tap-highlight-color: transparent; }

        /* --- HEADER & BACK BUTTON --- */
        .top-nav { background: var(--brand-gradient); padding: 20px 20px 25px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: white; }
        .header-top-row { display: flex; justify-content: space-between; align-items: center; }
        .header-content h1 { font-size: 18px; font-weight: 700; color: var(--accent-color); margin: 0; }
        
        .action-bar { padding: 15px 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .back-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; font-size: 16px; color: var(--brand-color); background: var(--card-bg); border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-decoration: none; border: 1px solid var(--border-color); flex-shrink: 0; }
        
        .page-container { padding: 0 20px 30px 20px; }

        /* --- TABLE CARD DESIGN (Like Screenshot) --- */
        .table-card { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid var(--border-color); overflow: hidden; margin-top: 10px; }
        .table-header-title { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; font-weight: 800; color: var(--brand-color); display: flex; align-items: center; gap: 8px; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; text-align: left; }
        th { padding: 15px; font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border-color); background: #f8fafc; letter-spacing: 0.5px; }
        td { padding: 15px; font-size: 12px; font-weight: 600; color: var(--text-main); border-bottom: 1px solid #f1f5f9; vertical-align: top; }
        tr:last-child td { border-bottom: none; }

        /* --- BADGES & LINKS --- */
        .tc-badge { background: #e0e7ff; color: #4f46e5; padding: 5px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; display: inline-block; white-space: nowrap; }
        
        .badge-status { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; display: inline-block; }
        .s-pending { background: #fee2e2; color: #dc2626; }
        .s-solved { background: #dcfce7; color: #16a34a; }
        
        .stat-time { font-size: 9px; color: var(--text-muted); font-weight: 600; margin-top: 5px; white-space: nowrap; }

        .proof-link { color: #6366f1; text-decoration: none; font-weight: 800; display: flex; align-items: center; gap: 5px; font-size: 12px; }
        .proof-link i { font-size: 14px; }
        
        #loadingText { text-align: center; padding: 20px; font-size: 13px; color: var(--brand-color); font-weight: 600; }
        #noDataText { text-align: center; padding: 40px 20px; font-size: 13px; color: var(--text-muted); display: none; font-weight: 600;}
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="header-top-row">
            <div class="header-content">
                <h1>SRI VISHNU PRIYA</h1>
                <div style="font-size: 13px; opacity: 0.9; margin-top:3px; font-weight: 600;" id="userDisplay">My Complaints</div>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    </div>

    <div class="page-container">
        
        <div class="table-card">
            <div class="table-header-title">
                <i class="fas fa-inbox" style="color:#6366f1;"></i> Pending & Solved Complaints
            </div>
            
            <div id="loadingText"><i class="fas fa-circle-notch fa-spin"></i> Fetching complaints against you...</div>
            <div id="noDataText"><i class="fas fa-check-circle" style="font-size:30px; color:#10b981; margin-bottom:10px; display:block;"></i>No complaints found against you. Great job!</div>
            
            <div class="table-responsive" id="tableContainer" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>HP Num</th>
                            <th>Raised By</th>
                            <th>Complaint Details</th>
                            <th>Proof</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="complaintsTableBody">
                        <!-- Data injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        window.currentEmpId = null;
        window.currentEmpName = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentEmpId = user.email.split('@')[0];
                window.currentEmpName = window.currentEmpId; 
                
                try {
                    const snap = await get(child(ref(db), `employees/${window.currentEmpId}`));
                    if(snap.exists() && snap.val().name) {
                        window.currentEmpName = snap.val().name;
                    }
                } catch(e) {}

                document.getElementById('userDisplay').innerText = `${window.currentEmpName}'s Complaints`;
                window.fetchComplaints();
            } else {
                window.location.href = "index.html"; 
            }
        });

        window.formatDisplayDate = function(dStr) {
            if(!dStr) return "N/A";
            const parts = dStr.split('-');
            if(parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return dStr;
        };

        window.fetchComplaints = async function() {
            if(!window.currentEmpId) return;

            try {
                document.getElementById('loadingText').style.display = 'block';
                document.getElementById('noDataText').style.display = 'none';
                document.getElementById('tableContainer').style.display = 'none';
                const tbody = document.getElementById('complaintsTableBody');
                tbody.innerHTML = '';

                // Fetch ALL complaints to filter those aimed at this employee
                const snapshot = await get(ref(db, `complaints`));
                
                if (snapshot.exists()) {
                    let myComplaints = [];
                    const data = snapshot.val();
                    
                    // The database structure might group by user who raised it
                    for(let key1 in data) {
                        let userGroup = data[key1];
                        if (typeof userGroup === 'object') {
                            for (let compId in userGroup) {
                                let c = userGroup[compId];
                                // Match logic: Telecaller targets the employee by name or ID
                                if (c && typeof c === 'object') {
                                    let targetName = String(c.branchEmpName || "").toLowerCase().trim();
                                    let myName = String(window.currentEmpName).toLowerCase().trim();
                                    let myId = String(window.currentEmpId).toLowerCase().trim();
                                    
                                    // If the complaint is against THIS employee
                                    if (targetName === myName || targetName === myId || c.targetEid === window.currentEmpId) {
                                        myComplaints.push(c);
                                    }
                                }
                            }
                        }
                    }

                    // Sort: Pending top, then by Latest Date
                    myComplaints.sort((a, b) => {
                        let aStatus = (a.status === 'SOLVED' || a.status === 'CLEARED') ? 1 : 0;
                        let bStatus = (b.status === 'SOLVED' || b.status === 'CLEARED') ? 1 : 0;
                        if(aStatus !== bStatus) return aStatus - bStatus;
                        return (b.timestamp || 0) - (a.timestamp || 0);
                    });

                    if (myComplaints.length > 0) {
                        myComplaints.forEach(c => {
                            let isSolved = (c.status === 'SOLVED' || c.status === 'CLEARED');
                            let statText = isSolved ? 'SOLVED' : 'PENDING';
                            let badgeClass = isSolved ? 's-solved' : 's-pending';
                            
                            let proofHtml = '';
                            if(c.proofUrl && c.proofUrl !== 'N/A') {
                                proofHtml = `<a href="${c.proofUrl}" target="_blank" class="proof-link"><i class="fas fa-link"></i> View</a>`;
                            } else {
                                proofHtml = `<span style="font-size:11px; color:var(--text-muted); font-weight:600;">No Proof</span>`;
                            }

                            // Format Telecaller Name Badge
                            let raisedByText = c.raisedBy || c.eid || "ADMIN";
                            if(!raisedByText.toUpperCase().startsWith("TC:")) {
                                raisedByText = "TC: " + raisedByText;
                            }

                            let statTimeHtml = (isSolved && c.solvedTime) ? `<div class="stat-time">${c.solvedTime}</div>` : '';

                            const row = `
                                <tr>
                                    <td style="font-weight:700;">${window.formatDisplayDate(c.date)}</td>
                                    <td><strong style="color:var(--text-main); font-size:13px;">${c.hp}</strong></td>
                                    <td><span class="tc-badge">${raisedByText.toUpperCase()}</span></td>
                                    <td style="max-width:200px; line-height:1.6; color:var(--text-muted); font-size:11px;">${c.details}</td>
                                    <td>${proofHtml}</td>
                                    <td>
                                        <div class="badge-status ${badgeClass}">${statText}</div>
                                        ${statTimeHtml}
                                    </td>
                                </tr>
                            `;
                            tbody.innerHTML += row;
                        });
                        document.getElementById('tableContainer').style.display = 'block';
                    } else {
                        document.getElementById('noDataText').style.display = 'block';
                    }
                } else {
                    document.getElementById('noDataText').style.display = 'block';
                }

            } catch(error) {
                console.error("Error fetching complaints:", error);
                alert("Failed to load complaints.");
            } finally {
                document.getElementById('loadingText').style.display = 'none';
            }
        };
    </script>
</body>
</html>
