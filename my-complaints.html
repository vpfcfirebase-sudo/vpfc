<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sri Vishnu Priya Finance - My Complaints</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME STYLES --- */
        :root {
            --primary-bg: #f4f7fe; 
            --brand-color: #0c2046; 
            --brand-gradient: linear-gradient(135deg, #0B3B60 0%, #1a5276 100%);
            --accent-color: #E2A03F; 
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', Arial, sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-main); -webkit-tap-highlight-color: transparent; }

        /* --- HEADER & BACK BUTTON --- */
        .top-nav { background: var(--brand-gradient); padding: 20px 20px 25px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: white; }
        .header-top-row { display: flex; justify-content: space-between; align-items: center; }
        .header-content h1 { font-size: 18px; font-weight: 700; color: var(--accent-color); margin: 0; }
        
        .action-bar { padding: 15px 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .back-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; font-size: 16px; color: var(--brand-color); background: var(--card-bg); border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-decoration: none; border: 1px solid var(--border-color); flex-shrink: 0; }
        
        .page-container { padding: 0 20px 30px 20px; }
        
        .section-header { font-size: 14px; font-weight: 900; color: var(--brand-color); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- STRICT WARNING CARD DESIGN --- */
        .alert-card {
            background: #ffffff;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-left: 6px solid #dc2626; /* Scary Red Left Border */
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.1);
            overflow: hidden;
        }
        
        .alert-card.solved {
            border-left-color: #16a34a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        .ac-header {
            background: #f8fafc;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .ac-date { font-weight: 800; color: #1e293b; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        
        .ac-status { font-weight: 900; font-size: 11px; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .ac-pending { background: #fef2f2; color: #b91c1c; border: 1px solid #f87171; animation: pulse 2s infinite; }
        .ac-solved { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .ac-body { padding: 15px; }
        
        .ac-row { display: flex; align-items: flex-start; margin-bottom: 12px; font-size: 13px; }
        .ac-label { font-weight: 800; color: var(--text-muted); width: 100px; flex-shrink: 0; text-transform: uppercase; font-size: 11px; margin-top: 2px; }
        .ac-val { font-weight: 800; color: var(--text-main); }
        
        .hp-badge { font-size: 14px; color: #0284c7; background: #e0f2fe; padding: 3px 8px; border-radius: 6px; border: 1px solid #bae6fd; }
        .tc-badge { font-size: 11px; color: #4338ca; background: #e0e7ff; padding: 3px 8px; border-radius: 6px; border: 1px solid #c7d2fe; display: inline-flex; align-items: center; gap: 4px;}

        /* RED COMPLAINT BOX inside the card */
        .ac-desc-box {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #9f1239;
            font-weight: 700;
            line-height: 1.5;
        }
        
        .ac-desc-box.solved-desc {
            background: #f8fafc;
            border-color: #e2e8f0;
            color: #334155;
        }
        
        .ac-desc-title { font-size: 11px; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; opacity: 0.8; display: flex; align-items: center; gap: 5px;}

        .ac-footer { border-top: 1px dashed var(--border-color); padding-top: 12px; display: flex; justify-content: space-between; align-items: center; }
        
        .proof-btn { color: #6366f1; text-decoration: none; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: #f1f5f9; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color);}
        .proof-btn:active { background: #e2e8f0; }

        .stat-time { font-size: 10px; color: var(--text-muted); font-weight: 700; }

        #loadingText { text-align: center; padding: 20px; font-size: 14px; color: var(--brand-color); font-weight: 700; }
        #noDataText { text-align: center; padding: 40px 20px; font-size: 14px; color: var(--text-muted); display: none; font-weight: 700;}
        .empty-icon { font-size: 40px; color: #10b981; margin-bottom: 15px; display: block; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="header-top-row">
            <div class="header-content">
                <h1>SRI VISHNU PRIYA</h1>
                <div style="font-size: 13px; opacity: 0.9; margin-top:3px; font-weight: 600;" id="userDisplay">My Complaints</div>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    </div>

    <div class="page-container">
        
        <div class="section-header">
            <i class="fas fa-exclamation-triangle" style="color:#dc2626;"></i> Action Required / Warnings
        </div>
        
        <div id="loadingText"><i class="fas fa-circle-notch fa-spin"></i> Loading complaints...</div>
        
        <div id="noDataText">
            <i class="fas fa-shield-check empty-icon"></i>
            No official complaints found against you.<br>Keep up the good work!
        </div>
        
        <div id="complaintsListContainer">
            <!-- Cards injected by JS -->
        </div>

    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f",
            storageBucket: "sri-vishnu-priya-finance-c591f.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        window.currentEmpId = null;
        window.currentEmpName = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentEmpId = user.email.split('@')[0];
                window.currentEmpName = window.currentEmpId; 
                
                try {
                    const snap = await get(child(ref(db), `employees/${window.currentEmpId}`));
                    if(snap.exists() && snap.val().name) {
                        window.currentEmpName = snap.val().name;
                    }
                } catch(e) {}

                document.getElementById('userDisplay').innerText = `${window.currentEmpName}'s Warnings`;
                window.fetchComplaints();
            } else {
                window.location.href = "index.html"; 
            }
        });

        // Date formatter
        window.formatDisplayDate = function(dStr) {
            if(!dStr) return "N/A";
            const justDate = dStr.split(' ')[0];
            return justDate;
        };

        window.fetchComplaints = async function() {
            if(!window.currentEmpId) return;

            try {
                document.getElementById('loadingText').style.display = 'block';
                document.getElementById('noDataText').style.display = 'none';
                const container = document.getElementById('complaintsListContainer');
                container.innerHTML = '';

                // FETCHING DIRECTLY FROM THIS EMPLOYEE'S NODE
                // Telecaller saves directly to complaints/employeeId
                const snapshot = await get(ref(db, `complaints/${window.currentEmpId}`));
                
                if (snapshot.exists()) {
                    let myComplaints = [];
                    const data = snapshot.val();
                    
                    for (let key in data) {
                        if(data[key] && typeof data[key] === 'object') {
                            myComplaints.push(data[key]);
                        }
                    }

                    // Sort: Pending Top -> Solved Bottom -> Latest First
                    myComplaints.sort((a, b) => {
                        let aStatus = (a.status === 'Solved' || a.status === 'CLEARED' || a.status === 'SOLVED') ? 1 : 0;
                        let bStatus = (b.status === 'Solved' || b.status === 'CLEARED' || b.status === 'SOLVED') ? 1 : 0;
                        if(aStatus !== bStatus) return aStatus - bStatus;
                        return (b.timestamp || 0) - (a.timestamp || 0);
                    });

                    if (myComplaints.length > 0) {
                        myComplaints.forEach(c => {
                            let isSolved = (c.status === 'Solved' || c.status === 'CLEARED' || c.status === 'SOLVED');
                            
                            let cardClass = isSolved ? 'solved' : '';
                            let statText = isSolved ? 'SOLVED' : 'PENDING ACTION';
                            let badgeClass = isSolved ? 'ac-solved' : 'ac-pending';
                            let iconClass = isSolved ? 'fas fa-check-double' : 'fas fa-exclamation-circle';
                            let boxClass = isSolved ? 'solved-desc' : '';
                            
                            let proofHtml = '';
                            if(c.proof && c.proof !== 'N/A' && c.proof !== "") {
                                proofHtml = `<a href="${c.proof}" target="_blank" class="proof-btn"><i class="fas fa-file-image"></i> Attached Proof</a>`;
                            } else if(c.proofUrl && c.proofUrl !== 'N/A') {
                                proofHtml = `<a href="${c.proofUrl}" target="_blank" class="proof-btn"><i class="fas fa-file-image"></i> Attached Proof</a>`;
                            } else {
                                proofHtml = `<span style="font-size:11px; color:var(--text-muted); font-weight:700;"><i class="fas fa-times-circle"></i> No Proof Uploaded</span>`;
                            }

                            // Handling mapped variables carefully
                            let raisedByText = c.raisedByName || c.raisedBy || c.eid || "ADMIN";
                            if(!raisedByText.toUpperCase().startsWith("TC:")) {
                                raisedByText = "TC: " + raisedByText;
                            }

                            let displayDate = c.raisedDate || c.date || "N/A";
                            let statTimeHtml = (isSolved && c.solvedDate) ? `<div class="stat-time">Resolved: ${c.solvedDate}</div>` : '';

                            // Here is the fix: It looks for 'description' first (Telecaller), then 'details' (Old Employee App)
                            let descText = c.description || c.details || "No description provided by Telecaller.";

                            // THE SCARY BOX DESIGN
                            const card = `
                                <div class="alert-card ${cardClass}">
                                    <div class="ac-header">
                                        <div class="ac-date"><i class="far fa-calendar-alt"></i> ${window.formatDisplayDate(displayDate)}</div>
                                        <div class="ac-status ${badgeClass}"><i class="${iconClass}"></i> ${statText}</div>
                                    </div>
                                    <div class="ac-body">
                                        
                                        <div class="ac-row">
                                            <div class="ac-label">Raised By</div>
                                            <div class="ac-val"><span class="tc-badge"><i class="fas fa-headset"></i> ${raisedByText.toUpperCase()}</span></div>
                                        </div>
                                        
                                        <div class="ac-row">
                                            <div class="ac-label">HP Number</div>
                                            <div class="ac-val"><span class="hp-badge">${c.hp || 'N/A'}</span></div>
                                        </div>

                                        <div class="ac-desc-box ${boxClass}">
                                            <div class="ac-desc-title"><i class="fas fa-bullhorn"></i> Official Complaint Details</div>
                                            ${descText}
                                        </div>

                                        <div class="ac-footer">
                                            ${proofHtml}
                                            ${statTimeHtml}
                                        </div>

                                    </div>
                                </div>
                            `;
                            container.innerHTML += card;
                        });
                    } else {
                        document.getElementById('noDataText').style.display = 'block';
                    }
                } else {
                    document.getElementById('noDataText').style.display = 'block';
                }

            } catch(error) {
                console.error("Error fetching complaints:", error);
                alert("Failed to load complaints.");
            } finally {
                document.getElementById('loadingText').style.display = 'none';
            }
        };
    </script>
</body>
</html>
